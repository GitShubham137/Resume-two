<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume Analyzer</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f6f8;
            padding: 40px;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        p {
            text-align: center;
        }

        h2 {
            color: #4f46e5;
            text-align: center;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.3s;
        }

        button:hover {
            background: #4338ca;
        }

        button:disabled {
            background: #a5a2e1;
            cursor: not-allowed;
        }

        /* Loading Spinner */
        #loading {
            display: none;
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
            color: #4f46e5;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4f46e5;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Result Formatting */
        .output {
            margin-top: 30px;
            display: none;
            border-top: 2px solid #eee;
            padding-top: 20px;
        }

        .section-title {
            color: #1f2937;
            border-left: 4px solid #4f46e5;
            padding-left: 10px;
            margin-top: 25px;
            font-size: 1.2rem;
        }

        .feedback-text {
            background: #f9fafb;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
            white-space: pre-wrap;
        }

        .question-list {
            margin-top: 10px;
            padding-left: 20px;
        }

        .question-item {
            background: #fff;
            margin-bottom: 10px;
            padding: 10px;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            list-style-type: decimal;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>AI Resume Analyzer</h2>
        <p>50% done🥳</p>

        <form id="resumeForm">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="name" placeholder="e.g. Shubh" required />
            </div>

            <div class="form-group">
                <label>Years of Experience</label>
                <input type="number" id="experience" placeholder="e.g. 1" required />
            </div>

            <div class="form-group">
                <label>Resume (PDF)</label>
                <input type="file" id="resume" accept=".pdf" required />
            </div>

            <button type="submit" id="submitBtn">Analyze Resume</button>
        </form>

        <div id="loading">
            <div class="spinner"></div>
            Analyzing your resume...
        </div>

        <div class="output" id="result">
            <div id="feedbackContainer">
                <h3 class="section-title">📄 Feedback</h3>
                <div class="feedback-text" id="feedbackContent"></div>
            </div>

            <div id="questionsContainer">
                <h3 class="section-title">🧠 Interview Questions</h3>
                <ul class="question-list" id="questionsContent"></ul>
            </div>
        </div>
    </div>

    <script>
        document.getElementById("resumeForm").addEventListener("submit", async function (e) {
            e.preventDefault();

            const name = document.getElementById("name").value;
            const experience = document.getElementById("experience").value;
            const resumeFile = document.getElementById("resume").files[0];

            const submitBtn = document.getElementById("submitBtn");
            const loadingDiv = document.getElementById("loading");
            const resultDiv = document.getElementById("result");

            if (!resumeFile) {
                alert("Please upload a resume file.");
                return;
            }

            // UI State: Loading
            submitBtn.disabled = true;
            loadingDiv.style.display = "block";
            resultDiv.style.display = "none";

            try {
                const formData = new FormData();
                formData.append("name", name);
                formData.append("experience", experience);
                // NOTE: Key must match upload.single("resume") in your backend
                formData.append("resume", resumeFile);

                //Local
                // const response = await fetch("http://localhost:5000/analyze/analyze-resume", {
                //     method: "POST",
                //     body: formData
                // });

                //Model
                const response = await fetch("http://localhost:5000/analyze/analyze", {
                    method: "POST",
                    body: formData
                });

                //Vercel
                // const response = await fetch("/analyze/analyze-resume", {
                //     method: "POST",
                //     body: formData
                // });

                if (!response.ok) {
                    throw new Error(`Server Error: ${response.statusText}`);
                }

                const data = await response.json();
                renderResults(data);

            } catch (err) {
                console.error("❌ Error:", err);
                alert("Failed to analyze resume. Check console for details.");
            } finally {
                // UI State: Reset
                submitBtn.disabled = false;
                loadingDiv.style.display = "none";
            }
        });

        function renderResults(data) {
            const resultDiv = document.getElementById("result");
            const feedbackContent = document.getElementById("feedbackContent");
            const questionsContent = document.getElementById("questionsContent");

            // 1. Render Feedback
            feedbackContent.innerText = data.feedback || "No feedback available.";

            // 2. Render Questions
            questionsContent.innerHTML = ""; // Clear old questions
            const questions = data.questions || [];

            if (questions.length > 0) {
                questions.forEach(q => {
                    const li = document.createElement("li");
                    li.className = "question-item";
                    li.innerText = q;
                    questionsContent.appendChild(li);
                });
            } else {
                questionsContent.innerHTML = "<li>No questions generated.</li>";
            }

            // Show result div
            resultDiv.style.display = "block";
        }
    </script>

</body>

</html>
